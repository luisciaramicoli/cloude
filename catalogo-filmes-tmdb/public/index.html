<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Filmes - Tom Hanks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  
  <header>
    <div class="logo">
      <h1>TomHanks<span class="highlight">Flix</span></h1>
    </div>
    <div id="user-info" class="hidden">
      <span id="user-name"></span>
      <button id="btn-logout" class="btn btn-outline">Sair</button>
    </div>
  </header>

  <main id="app">
    <!-- Login/Register View -->
    <section id="auth-section" class="view active">
      <div class="auth-card glass-panel">
        <div class="auth-tabs">
          <button id="tab-login" class="active">Login</button>
          <button id="tab-register">Cadastro</button>
        </div>
        
        <form id="login-form" class="auth-form active">
          <h2>Bem-vindo de volta</h2>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>
          </div>
          <div class="form-group">
            <label for="login-password">Senha</label>
            <input type="password" id="login-password" required>
          </div>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <h2>Crie sua conta</h2>
          <div class="form-group">
            <label for="reg-name">Nome</label>
            <input type="text" id="reg-name" required>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Senha</label>
            <input type="password" id="reg-password" required>
          </div>
          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
      </div>
    </section>

    <!-- Catalog View -->
    <section id="catalog-section" class="view hidden">
      <div class="catalog-header">
        <h2>Catálogo Tom Hanks</h2>
        <p>Explore, favorite e comente nos filmes do seu ator favorito. Seus dados são totalmente privados.</p>
      </div>
      <div id="movies-grid" class="movies-grid">
        <!-- Movies will be injected here -->
      </div>
    </section>
  </main>

  <!-- Modal for Comments -->
  <div id="comment-modal" class="modal hidden">
    <div class="modal-content glass-panel">
      <span class="close-btn">&times;</span>
      <h3 id="modal-movie-title"></h3>
      <div class="comments-list" id="comments-list">
        <!-- Comments injected here -->
      </div>
      <form id="comment-form">
        <textarea id="comment-text" placeholder="Deixe seu comentário..." required></textarea>
        <button type="submit" class="btn btn-primary">Comentar</button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
